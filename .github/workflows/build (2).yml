name: Build Hidden Settings

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package APK and Magisk module
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist module/system/app/HiddenSettings
          cp -r magisk/. module/
          cp "$APK" module/system/app/HiddenSettings/HiddenSettings.apk
          (cd module && zip -r9 ../dist/HiddenSettings-Magisk-module.zip .)
          cp "$APK" dist/HiddenSettings.apk
          ls -la dist

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: HiddenSettings
          path: dist/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: dist/*
